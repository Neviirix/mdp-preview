<style>
:root{
  --bg:#F3F0EB; --surface:#FFFFFF; --surface-2:#ECE8E1; --line:#DFD8CD; --line-strong:#C9C0B2;
  --ink:#1B232D; --muted:#56606B; --accent:#143C78; --accent-ink:#FFFFFF; --accent-soft:#DFE7F3; --brand-green:#2E9E48;
  --warn:#94460F; --warn-soft:#F6E3D1; --danger:#A12626; --danger-soft:#F7DDDD;
  --ok:#2C6636; --ok-soft:#DCEDDC; --violet:#4B3F86; --violet-soft:#E7E3F3;
  --shadow:0 10px 30px rgba(27,35,45,.16);
  --display:'Poppins','Segoe UI',system-ui,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12171C; --surface:#1A2128; --surface-2:#232B33; --line:#2F3841; --line-strong:#445059;
    --ink:#E8ECEF; --muted:#A3ADB7; --accent:#8FB4EC; --accent-ink:#0B1730; --accent-soft:#1A2840; --brand-green:#5BC777;
    --warn:#F0A56E; --warn-soft:#382515; --danger:#F29090; --danger-soft:#3A1D1D;
    --ok:#8ACB92; --ok-soft:#1A3120; --violet:#B6ABEF; --violet-soft:#29243F;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12171C; --surface:#1A2128; --surface-2:#232B33; --line:#2F3841; --line-strong:#445059;
  --ink:#E8ECEF; --muted:#A3ADB7; --accent:#8FB4EC; --accent-ink:#0B1730; --accent-soft:#1A2840; --brand-green:#5BC777;
  --warn:#F0A56E; --warn-soft:#382515; --danger:#F29090; --danger-soft:#3A1D1D;
  --ok:#8ACB92; --ok-soft:#1A3120; --violet:#B6ABEF; --violet-soft:#29243F;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;flex-grow:1;min-width:0}
.brand b{font-family:'Poppins',var(--body);font-size:17px;line-height:1.15;font-weight:700;letter-spacing:-.01em;min-width:0;color:var(--accent)}
.brand b .g{color:var(--brand-green)}
.brand .mark{display:flex;flex-shrink:0}
.brand .mark svg{display:block;border-radius:9px}
.brand .tag{align-self:center}
@media (max-width:440px){.brand .tag{display:none}.brand b{font-size:16px}}
.btn-row>.btn{white-space:nowrap;padding:0 10px}
.tag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);border-radius:6px;padding:2px 6px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.role{display:grid;grid-template-columns:auto 1fr 1fr;align-items:center;gap:6px;background:var(--surface-2);border-radius:12px;padding:4px}
.role span{font-size:13px;color:var(--muted);padding:0 8px}
.role button{height:36px;border:none;border-radius:9px;background:transparent;font-weight:600;font-size:15px;color:var(--muted)}
.role button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Main */
.main{padding:16px;display:flex;flex-direction:column;gap:18px;flex-grow:1}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.2;letter-spacing:-.01em}
.h2{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.25}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-lg{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:center;padding:13px 14px;background:none;border:none;text-align:left;width:100%}
button.item:hover{background:var(--surface-2)}
.list>button.item:first-child{border-radius:14px 14px 0 0}
.list>button.item:last-child{border-radius:0 0 14px 14px}
.list>button.item:only-child{border-radius:14px}
.item-main{display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0}
.item-title{font-weight:600}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.ico.acc{background:var(--accent-soft);color:var(--accent)}
.ico.vio{background:var(--violet-soft);color:var(--violet)}
.ico.ok{background:var(--ok-soft);color:var(--ok)}
.ico.dan{background:var(--danger-soft);color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:0;text-align:left}
.stat b{font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-vio{background:var(--violet-soft);color:var(--violet)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-dan{background:var(--danger-soft);color:var(--danger)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.btn{min-height:48px;border-radius:13px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:40px;font-size:14px;border-radius:11px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1 1 0}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:700;padding:8px 0;min-height:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.back{display:flex;align-items:center;gap:4px;margin-left:-10px}
.back button{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;border-radius:22px}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.dan{background:var(--danger-soft);color:var(--danger)}
/* Photos */
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;position:relative;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.sample{padding-bottom:34px}
.ph .ts{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:1.3;padding:4px 5px;text-align:center;font-variant-numeric:tabular-nums}
.ph.sample{background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--bg) 10px 20px)}
.addph input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.addph{position:relative;aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:13px;cursor:pointer;background:transparent}
/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.flabel{font-size:14px;font-weight:600}
.inp{height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);padding:0 12px;font-size:16px;width:100%}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:600;padding:4px}
.seg button[aria-pressed="true"].c-Good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].c-Fair{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"].c-Damaged{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.urg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.urg label{position:relative;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:8px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;min-height:58px;justify-content:center}
.urg input{position:absolute;opacity:0}
.urg label:has(input:checked){border:2px solid var(--accent);background:var(--accent-soft)}
.urg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.urg b{font-size:15px}
.urg span{font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex-shrink:0}
/* Stepper */
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.steps div{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.steps i{display:block;height:6px;border-radius:3px;background:var(--line)}
.steps .done i{background:var(--accent)}
.steps .cur{color:var(--ink);font-weight:700}
.steps .cur i{background:var(--accent)}
/* Activity */
.act{display:flex;gap:10px;padding:12px 14px}
.av{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.av.landlord{background:var(--accent-soft);color:var(--accent)}
.av.tenant{background:var(--violet-soft);color:var(--violet)}
.av.system,.av.prevtenant{background:var(--surface-2);color:var(--muted)}
/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:68px}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav .dot{position:absolute;top:10px;left:calc(50% + 8px);width:9px;height:9px;border-radius:5px;background:var(--danger)}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:4px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
/* Signature */
.sig{width:100%;height:150px;border:1.5px dashed var(--line-strong);border-radius:12px;background:var(--surface);touch-action:none;display:block}
.sigimg{height:60px;max-width:100%;background:#fff;border-radius:8px;border:1px solid var(--line)}
/* Report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 18px;display:flex;flex-direction:column;gap:18px;font-size:14px}
.report h3{font-family:var(--display);font-weight:600;font-size:17px;border-bottom:1px solid var(--line);padding-bottom:6px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chg{color:var(--danger);font-weight:700}
.progress{height:6px;border-radius:3px;background:var(--line)}
.progress i{display:block;height:6px;border-radius:3px;background:var(--accent)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* Sign-in */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.brand-lockup{display:flex;align-items:center;gap:12px}
.brand-lockup svg{display:block;border-radius:13px}
.wm{font-family:'Poppins',var(--body);font-weight:700;font-size:22px;line-height:1.1;color:var(--accent);display:block}
.wm .g{color:var(--brand-green)}
.by{font-family:'Poppins',var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.login-foot{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.login-foot svg{flex-shrink:0;margin-top:2px}
.code-inp{letter-spacing:.4em;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
/* Portal: shared */
.nav-brand,.nav-foot,.nav .nav-help{display:none}
.home-grid{display:flex;flex-direction:column;gap:18px}
.home-grid .col{display:flex;flex-direction:column;gap:18px}
.home-grid .side{order:-1}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right}
/* Portal: computer and tablet layout */
@media (min-width:900px){
  .shell{max-width:none;margin:0 0 0 248px;padding-bottom:40px}
  .top{flex-direction:row;align-items:center;gap:16px;padding:14px max(28px,calc((100% - 1040px)/2))}
  .top .brand .mark,.top .brand b{display:none}
  .top .brand .tag{display:inline-block}
  .top-row{order:2;flex-grow:1}
  .role{order:1;width:360px;flex-shrink:0}
  .main{width:100%;max-width:1096px;margin:0 auto;padding:28px;gap:22px}
  .h1{font-size:30px}
  .nav{top:0;right:auto;width:248px;border-top:none;border-right:1px solid var(--line);padding:18px 14px 14px;display:flex;flex-direction:column;gap:14px}
  .nav-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 10px}
  .nav-brand svg{display:block;border-radius:9px}
  .nav-brand b{font-family:'Poppins',var(--body);font-weight:700;font-size:15px;line-height:1.15;color:var(--accent)}
  .nav-brand .g{color:var(--brand-green)}
  .nav-in{display:flex;flex-direction:column;height:auto;gap:4px;max-width:none;flex-grow:1;margin:0;width:100%}
  .nav .nav-help{display:flex;flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 14px;border-radius:12px;font-size:15px;margin-bottom:8px}
  .nav .nav-help:hover{background:var(--surface-2)}
  .nav-in button{flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 14px;border-radius:12px;font-size:15px}
  .nav-in button:hover{background:var(--surface-2)}
  .nav-in button[aria-current="page"]{background:var(--accent-soft)}
  .nav .dot{top:9px;left:30px}
  .nav-foot{display:flex;align-items:center;gap:10px;padding:12px 4px 0;border-top:1px solid var(--line)}
  .nav-foot .item-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
  .home-grid .side{order:0}
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:20px;max-width:580px;max-height:86vh}
  .grab{display:none}
  .toast{bottom:24px;left:calc(50% + 124px)}
}
/* Backup */
.tree{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;overflow-x:auto}
.tree ul{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px dashed var(--line-strong);margin-left:7px}
.tree>ul{padding-left:0;border:none;margin-left:0}
.tree li{padding:3px 0}
.tf{display:inline-flex;gap:8px;align-items:flex-start;line-height:1.35}
.tf svg{flex-shrink:0;margin-top:1px;color:var(--accent)}
.tf .xs{display:block}
/* Public website */
.site{min-height:100vh;background:var(--bg)}
.wrap{max-width:1140px;margin:0 auto;padding:0 28px}
.proto-strip{background:var(--accent);color:var(--accent-ink);font-size:13px;text-align:center;padding:6px 16px}
.site-top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.site-top .wrap{display:flex;align-items:center;gap:20px;height:74px}
.lock{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;text-align:left}
.lock svg{display:block;border-radius:9px}
.lock b{font-family:'Poppins',var(--body);font-weight:700;font-size:18px;line-height:1.1;color:var(--accent)}
.lock .g{color:var(--brand-green)}
.lock small{display:block;font-family:'Poppins',var(--body);font-weight:500;font-size:11.5px;color:var(--muted)}
.s-links{display:flex;gap:2px;flex-grow:1;justify-content:center}
.s-links button{background:none;border:none;padding:8px 10px;white-space:nowrap;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted)}
.s-links button:hover{color:var(--ink);background:var(--surface-2)}
.s-actions{display:flex;gap:10px;margin-left:auto}
.s-actions .btn{white-space:nowrap}
.s-h{font-family:'Poppins',var(--body);font-weight:700;letter-spacing:-.02em;color:var(--ink);margin:0;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-green)}
.hero{padding:72px 0 64px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:center}
.hero h1{font-size:clamp(36px,4.6vw,56px);line-height:1.06}
.hero h1 span{color:var(--accent)}
.hero p.lead{font-size:19px;line-height:1.55;color:var(--muted);margin:0;max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.cta .btn{min-height:52px;padding:0 22px;font-size:16px}
.trust{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.trust span{display:inline-flex;align-items:center;gap:6px}
.trust svg{color:var(--brand-green)}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.mock-bar{height:38px;background:var(--surface-2);display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid var(--line)}
.mock-bar i{width:10px;height:10px;border-radius:5px;background:var(--line-strong)}
.mock-bar span{margin-left:10px;font-size:12px;color:var(--muted);background:var(--surface);border-radius:6px;padding:3px 10px}
.mock-body{display:grid;grid-template-columns:120px 1fr;min-height:330px}
.mock-side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.mock-side div{padding:7px 9px;border-radius:8px;display:flex;align-items:center;gap:7px}
.mock-side div.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.mock-main{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mock-main .stats b{font-size:22px}
.mock-main .item{padding:10px 12px}
.mock-main .item-title{font-size:14px}
.mock-main .ico{width:32px;height:32px;border-radius:9px}
.sec{padding:76px 0}
.sec.alt{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{display:flex;flex-direction:column;gap:10px;max-width:640px;margin-bottom:36px}
.sec-head h2{font-size:clamp(28px,3.2vw,38px);line-height:1.15}
.sec-head p{font-size:18px;color:var(--muted);margin:0;line-height:1.55}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid2s{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px}
.sec.alt .tile{background:var(--bg)}
.tile h3{font-family:'Poppins',var(--body);font-weight:600;font-size:18px;margin:0}
.tile p{margin:0;color:var(--muted);line-height:1.55}
.num{width:38px;height:38px;border-radius:19px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:'Poppins',var(--body);font-weight:700}
.ticks{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.ticks svg{color:var(--brand-green);flex-shrink:0;margin-top:2px}
.price{max-width:640px;margin:0 auto;text-align:left;border:2px solid var(--accent)}
.vs-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.vs{width:100%;border-collapse:collapse;min-width:640px;font-size:16px}
.vs th,.vs td{padding:14px 18px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
.vs tr:last-child td{border-bottom:0}
.vs th:first-child,.vs td:first-child{text-align:left;color:var(--ink);font-weight:600}
.vs thead th{font-family:'Poppins',var(--body);font-size:15px;color:var(--muted);font-weight:600;background:var(--surface-2)}
.vs .us{background:var(--accent-soft);color:var(--accent);font-weight:700}
.vs thead th.us{color:var(--accent);background:var(--accent-soft);font-size:16px}
.vs .y{color:var(--ok);font-size:20px;font-weight:700}
.vs .n{color:var(--muted);font-size:18px}
.vs .s{color:var(--muted);font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.7));
      };
      img.onerror=function(){rej(new Error('Not an image'));};
      img.src=fr.result;
    };
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---------- Derived ---------- */
function dueLabel(due){
  var n=daysFrom(due);
  if(n<0)return plural(-n,'day')+' overdue';
  if(n===0)return 'Due today';
  if(n===1)return 'Due tomorrow';
  if(n<=30)return 'Due '+fmtD(due)+' · in '+n+' days';
  return 'Due '+fmtD(due);
}
function cycleLabel(m){return m===0?'One time':m===1?'Every month':m===12?'Every year':'Every '+m+' months';}
var STATUS=['submitted','seen','scheduled','progress','fixed','confirmed'];
var STATUS_LABEL={submitted:'Submitted',seen:'Seen',scheduled:'Scheduled',progress:'In progress',fixed:'Fixed',confirmed:'Confirmed'};
var STATUS_PILL={submitted:'p-warn',seen:'p-vio',scheduled:'p-acc',progress:'p-acc',fixed:'p-ok',confirmed:'p-mute'};
function repairNeed(r,role){
  if(role==='landlord'){
    if(r.status==='submitted')return 'Review request';
    if(r.status==='seen')return 'Schedule a visit';
    if(r.status==='progress')return 'Mark fixed when done';
  }else{
    if(r.status==='scheduled'&&r.schedule&&!r.schedule.ack)return 'Acknowledge visit';
    if(r.status==='fixed')return 'Confirm the fix';
  }
  return null;
}
function walkProgress(w){var tot=0,done=0;w.rooms.forEach(function(r){r.items.forEach(function(i){tot++;if(i.cond)done++;});});return {tot:tot,done:done};}
function roomDone(r){return r.items.every(function(i){return i.cond;});}
function walkStatusText(w){
  if(w.status==='draft'){var p=walkProgress(w);return p.done+' of '+p.tot+' items checked';}
  if(w.status==='signing'){var who=!w.sig.landlord?'landlord':!w.sig.tenant?'tenant':null;return who?'Waiting for '+roleLabel(who).toLowerCase()+' signature':'Signed by both';}
  return 'Signed by both';
}
function nextRent(){var t=d0(),day=state.unit.rentDay;var d=new Date(t.getFullYear(),t.getMonth(),day);if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,day);return d;}
function attention(){
  var role=me(),out=[];
  activeTasks().forEach(function(t){var n=daysFrom(t.due);if(t.owner===role&&n<=3)out.push({kind:'task',id:t.id,title:t.title,sub:(n<0?'Your task · ':'Your task · ')+dueLabel(t.due),pill:n<0?['Overdue','p-warn']:['Soon','p-acc'],icon:['clock',n<0?'warn':'acc']});});
  state.repairs.forEach(function(r){var need=repairNeed(r,role);if(need)out.push({kind:'repair',id:r.id,title:r.title,sub:'Repair · '+need,pill:[STATUS_LABEL[r.status],STATUS_PILL[r.status]],icon:['wrench','acc']});});
  state.walks.forEach(function(w){if(w.status==='signing'&&!w.sig[role])out.push({kind:'walk',id:w.id,title:w.kind+' walkthrough',sub:'Needs your signature',pill:['Sign','p-vio'],icon:['pen','vio']});
    if(w.status==='draft'&&w.startedBy===role)out.push({kind:'walk',id:w.id,title:w.kind+' walkthrough',sub:'In progress · '+walkStatusText(w),pill:['Draft','p-mute'],icon:['camera','vio']});});
  visibleDocs().forEach(function(d){if(d.expires){var n=daysFrom(d.expires);if(n>=0&&n<=30)out.push({kind:'doc',id:d.id,title:d.title+' expires',sub:'Document · '+fmtD(d.expires)+' (in '+n+' days)',pill:null,icon:['doc','vio']});}});
  return out;
}

function backupTree(){
  var u=state.unit,role=me(),parts=u.address.split(','),street=parts[0].trim(),unitName=(parts[1]||'Unit').trim();
  function fol(name,sub,kids){return '<li><span class="tf">'+ic('folder',16)+'<span><b>'+esc(name)+'</b>'+(sub?'<span class="xs muted">'+esc(sub)+'</span>':'')+'</span></span>'+(kids?'<ul>'+kids+'</ul>':'')+'</li>';}
  function file(name,sub){return '<li><span class="tf">'+ic('doc',16)+'<span>'+esc(name)+(sub?'<span class="xs muted">'+esc(sub)+'</span>':'')+'</span></span></li>';}
  var from=role==='tenant'?tenantFrom():0;
  var reps=state.repairs.filter(function(r){return r.createdAt>=from;});
  var done=0;state.tasks.forEach(function(t){t.history.forEach(function(h){if(h.at>=from)done++;});});
  var photos=0;state.walks.forEach(function(w){w.rooms.forEach(function(r){photos+=r.photos.length;});});
  var cur=fol('Tenancy: '+u.tenant+' ('+fmtD(u.tenancyFrom||u.leaseStart,true)+' to now)','',
    fol('Repairs',plural(reps.length,'repair')+', with photos and invoices')+
    fol('Upkeep',plural(done,'completed task')+', with proof photos')+
    fol('Walkthroughs',plural(state.walks.length,'walkthrough')+': signed PDFs and '+plural(photos,'photo'))+
    fol('Documents',plural(visibleDocs().length,'file')+(role==='tenant'?', including your private ones':'')));
  var kids;
  if(role==='landlord'){
    var prev=u.prevTenant?fol('Tenancy: '+u.prevTenant+' ('+fmtD(u.prevFrom,true)+' to '+fmtD(u.prevTo,true)+')','Repairs, upkeep, walkthroughs and documents from that tenancy'):'';
    kids=fol(street+', '+u.city,'',fol(unitName,'',file('Unit record.pdf','The full dated record, all tenancies')+file('Unit history.xlsx','Every entry, one row each')+cur+prev))+
      '<li class="xs muted" style="padding-top:6px">Each of your other properties gets its own folder here, by address.</li>';
  }else{
    kids=fol(street+', '+u.city,'',fol(unitName,'',file('My tenancy record.pdf','Your dated record, from move-in')+file('My tenancy history.xlsx','Every entry, one row each')+cur));
  }
  return '<div class="tree"><ul>'+fol('My Documented Property backup '+isoD(d0()),'',file('Read me.pdf','What is in this backup and how it is organized')+kids)+'</ul></div>';

/* ---------- Signature pad ---------- */
var sigDrawn=false;
function initSig(){
  var c=document.getElementById('sigpad');if(!c)return;
  sigDrawn=false;
  var dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();
  c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);
  var ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=getComputedStyle(document.body).color;
  var drawing=false;
  function pt(e){var r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
  c.addEventListener('pointerdown',function(e){drawing=true;sigDrawn=true;c.setPointerCapture(e.pointerId);var p=pt(e);ctx.beginPath();ctx.moveTo(p[0],p[1]);});
  c.addEventListener('pointermove',function(e){if(!drawing)return;var p=pt(e);ctx.lineTo(p[0],p[1]);ctx.stroke();});
  function end(){drawing=false;}
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function sigImage(){
  var c=document.getElementById('sigpad');if(!c||!sigDrawn)return null;
  // Draw on white so the signature reads in both themes
  var o=document.createElement('canvas');o.width=c.width;o.height=c.height;var x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);
  var tmp=document.createElement('canvas');tmp.width=c.width;tmp.height=c.height;var t=tmp.getContext('2d');t.drawImage(c,0,0);t.globalCompositeOperation='source-in';t.fillStyle='#1B232D';t.fillRect(0,0,tmp.width,tmp.height);
  x.drawImage(tmp,0,0);
  return o.toDataURL('image/jpeg',0.8);
}

  buyStorage:function(d){buy.storage=Math.max(0,buy.storage+Number(d.d));refreshBuy();},
  toPay:function(){sheetPay('landlord');},
  ownCopy:function(){closeSheet();buy.ex5=false;sheetOwnCopy();},
  toPayTenant:function(){sheetPay('tenant');},
  paid:function(d){var b=bill();if(d.k==='tenant'){b.tenantCopy=true;b.tenantExtra5+=buy.ex5?1:0;}else{if(FOUNDING_LEFT>0&&!b.founding){b.founding=true;FOUNDING_LEFT--;}b.units+=buy.units;b.storage10+=buy.storage;b.trialDays=null;}
    save();closeSheet();render();toast(d.k==='tenant'?'Your own copy is ready. Receipt emailed.':'Payment received. '+plural(b.units,'unit')+' unlocked. Receipt emailed.');},
  signup:function(){toast('Account sign-up comes in the full version');},
  toSite:function(){if(session){go({tab:'home'});return;}login.view='site';login.step='email';render(true);},
  toSignin:function(){login.view='signin';login.step='email';render(true);var e=document.getElementById('le');if(e)try{e.focus({preventScroll:true});}catch(x){}},
  scrollTo:function(d){var el=document.getElementById(d.id);if(el){var y=el.getBoundingClientRect().top+window.scrollY-80;window.scrollTo({top:y,behavior:'smooth'});}},
  loginBack:function(){login.step='email';render(true);},
  signOut:function(){session=null;saveSession();closeSheet();login.view='site';login.step='email';render(true);toast('Signed out');},
  timeline:function(){ui.timeline=true;render(true);},
  closeTimeline:function(){ui.timeline=false;render(true);},
  tlFilter:function(d){ui.tlFilter=d.f;render();},
  report:function(d,el){if(!el.closest('#main')||!ui.timeline)ui.timeline=false;ui.report=true;render(true);},
  expRange:function(d){ui.exp.range=d.r;render();},
  expSec:function(d){ui.exp.sec[d.s]=!ui.exp.sec[d.s];render();},
  closeReport:function(){ui.report=false;render(true);},
  taskFilter:function(d){ui.taskFilter=d.f;render();},
  task:function(d){sheetTask(d.id);},
  doneTask:function(d){closeSheet();sheetDone(d.id);},
  newTask:function(){sheetNewTask();},
  editTask:function(d){closeSheet();sheetEditTask(d.id);},
  removeTask:function(d,el){
    if(!ui.removeArm){ui.removeArm=true;el.textContent='Tap again to remove this task';return;}
    var t=getT(d.id);t.removed=true;ui.removeArm=false;
    log('upkeep','Removed task: '+t.title+' (past completions stay in the record)');
    notify('tenant',state.unit.landlord+' removed the task: '+t.title+'.',{tab:'upkeep'});
    commit('Task removed');
  },
  newRepair:function(){sheetReport();},
  repair:function(d){ui.repair=d.id;ui.pending=[];render(true);},
  closeRepair:function(){ui.repair=null;ui.pending=[];render(true);},
  rSeen:function(d){var r=getR(d.id);r.status='seen';ev(r,'status','Marked as seen');notify('tenant',state.unit.landlord+' has seen: '+r.title+'.',{repair:r.id});commit('Marked as seen');},
  rSchedule:function(d){sheetSchedule(d.id);},
  rStart:function(d){var r=getR(d.id);r.status='progress';ev(r,'status','Started work');notify('tenant','Work started on: '+r.title+'.',{repair:r.id});commit('Marked as in progress');},
  rFixed:function(d){sheetFixed(d.id);},
  rAck:function(d){var r=getR(d.id);r.schedule.ack=Date.now();ev(r,'status','Acknowledged the entry notice');notify('landlord',state.unit.tenant+' acknowledged the visit for '+r.title+'.',{repair:r.id});commit('Visit acknowledged');},
  rConfirm:function(d){var r=getR(d.id);r.status='confirmed';ev(r,'status','Confirmed the fix');notify('landlord',state.unit.tenant+' confirmed the fix: '+r.title+'.',{repair:r.id});commit('Repair closed');},
  rNotFixed:function(d){sheetNotFixed(d.id);},
  newWalk:function(){sheetNewWalk();},
  walk:function(d){go({walk:d.id});},
  closeWalk:function(){ui.walk=null;render(true);},
  room:function(d){ui.room=Number(d.i);render(true);},
  cond:function(d){var w=getW(ui.walk);var it=w.rooms[d.ri].items[d.ii];it.cond=d.c;save();var y=window.scrollY;render();window.scrollTo(0,y);},
  review:function(){ui.review=true;render(true);},
  closeReview:function(){ui.review=false;render(true);},
  compare:function(){ui.compare=true;render(true);},
  closeCompare:function(){ui.compare=false;render(true);},
  clearSig:function(){initSig();},
  testPhoto:function(d){addPhotos(d.t,[{src:testPhotoSrc(),label:'Test photo',at:Date.now()}]);toast('Test photo added');},
  newDoc:function(){sheetNewDoc();},
  doc:function(d){sheetDoc(d.id);},
  docCat:function(d){ui.docCat=d.c;render();},
  docVis:function(d){var doc=getDoc(d.id);doc.vis=doc.vis==='shared'?'private':'shared';log('docs',(doc.vis==='shared'?'Shared ':'Made private: ')+doc.title);save();closeSheet();render();toast(doc.vis==='shared'?'Shared with '+nameOf(other()):'Now visible only to you');}
};
function ev(r,kind,text,photos){r.events.push({at:Date.now(),by:me(),kind:kind,text:text,photos:photos||[]});if(kind==='status')log('repairs',text+' ('+r.title+')');}
function commit(msg){save();closeSheet();render();if(msg)toast(msg);}

/* ---------- Forms ---------- */
var F={
  help:function(fd){
    var n=1041+tickets().length,t={id:'MDP-'+n,kind:fd.get('kind'),subject:fd.get('subject').trim(),msg:fd.get('msg').trim(),by:me(),at:Date.now(),status:'received',reply:'',files:ui.pending.slice()};
    tickets().push(t);save();closeSheet();toast('Sent. Your reference is '+t.id+'.');
  },
  loginEmail:function(fd){
    login.email=fd.get('email').trim();login.role=fd.get('role')||'landlord';login.step='code';render(true);
    var c=document.getElementById('lc');if(c)try{c.focus();}catch(e){}
  },
  loginCode:function(fd){
    var code=(fd.get('code')||'').replace(/\s/g,'');
    if(!/^\d{6}$/.test(code)){toast('Enter the 6-digit code');return;}
    session=login.email;saveSession();state.role=login.role;save();login.step='email';
    go({tab:'home'});toast('Signed in as '+nameOf(state.role));
  },
  report:function(fd){
    var r={id:uid(),title:fd.get('title').trim(),room:fd.get('room'),type:fd.get('type'),urgency:fd.get('urgency'),status:'submitted',createdAt:Date.now(),by:me(),desc:fd.get('desc').trim(),photos:ui.pending.slice(),schedule:null,events:[]};
    state.repairs.push(r);ev(r,'status',me()==='tenant'?'Reported the issue':'Logged the issue');
    notify(other(),nameOf(me())+' reported: '+r.title+(r.urgency==='Emergency'?' (emergency)':'')+'.',{repair:r.id});
    save();closeSheet();go({repair:r.id});toast('Sent to '+nameOf(other()));
  },
  schedule:function(fd,form){
    var r=getR(form.dataset.id);var re=!!r.schedule&&r.status==='scheduled';
    r.schedule={date:fd.get('date'),window:fd.get('window'),note:fd.get('note').trim(),ack:null};r.status='scheduled';
    ev(r,'status',(re?'Rescheduled':'Scheduled')+' a visit: '+fmtWD(r.schedule.date)+', '+r.schedule.window+'. Written entry notice given.');
    notify('tenant',state.unit.landlord+' '+(re?'rescheduled':'scheduled')+' a visit for '+r.title+': '+fmtWD(r.schedule.date)+', '+r.schedule.window+'.',{repair:r.id});
    commit('Visit scheduled and notice sent');
  },
  fixed:function(fd,form){
    var r=getR(form.dataset.id);var note=fd.get('note').trim();var inv=fd.get('invoice');var hasInv=inv&&inv.name;
    r.status='fixed';ev(r,'status','Marked as fixed: '+note+(hasInv?' Invoice added to Documents.':''),ui.pending.slice());
    if(hasInv){state.docs.push({id:uid(),title:'Invoice: '+r.title,cat:'Receipts',vis:'shared',owner:me(),addedAt:Date.now(),expires:null,file:{name:inv.name,size:inv.size},repair:r.id});log('docs','Added Invoice: '+r.title);}
    notify('tenant',state.unit.landlord+' marked '+r.title+' as fixed. Please confirm.',{repair:r.id});
    ui.pending=[];commit('Marked fixed. Tenant asked to confirm.');
  },
  notfixed:function(fd,form){
    var r=getR(form.dataset.id);r.status='progress';ev(r,'status','Reported it’s still not fixed: '+fd.get('text').trim(),ui.pending.slice());
    notify('landlord',state.unit.tenant+' says '+r.title+' is still not fixed.',{repair:r.id});ui.pending=[];commit('Sent back to '+state.unit.landlord);
  },
  comment:function(fd,form){
    var text=fd.get('text').trim();if(!text&&!ui.pending.length){toast('Write a comment or add a photo first');return;}
    var r=getR(form.dataset.id);ev(r,'comment',text||'Added photos',ui.pending.slice());
    notify(other(),nameOf(me())+' commented on '+r.title+'.',{repair:r.id});ui.pending=[];save();render();toast('Comment sent');
  },
  done:function(fd,form){
    var t=getT(form.dataset.id);
    t.history.push({at:Date.now(),by:me(),note:fd.get('note').trim(),photos:ui.pending.slice()});
    log('upkeep','Completed: '+t.title);
    var msg='Marked done';
    if(t.months){t.due=isoD(addMonths(d0(),t.months));msg+='. Next due '+fmtD(t.due,true);}
    notify(other(),nameOf(me())+' completed: '+t.title+'.',{tab:'upkeep'});
    ui.pending=[];commit(msg);
  },
  edittask:function(fd,form){
    var t=getT(form.dataset.id),old=t.title,diffs=[];
    var title=fd.get('title').trim(),owner=fd.get('owner'),months=Number(fd.get('months')),due=fd.get('due');
    if(title&&title!==t.title)diffs.push('renamed to “'+title+'”');
    if(owner!==t.owner)diffs.push('responsible: '+roleLabel(t.owner).toLowerCase()+' → '+roleLabel(owner).toLowerCase());
    if(months!==t.months)diffs.push(cycleLabel(t.months).toLowerCase()+' → '+cycleLabel(months).toLowerCase());
    if(due!==t.due)diffs.push('next due '+fmtD(t.due,true)+' → '+fmtD(due,true));
    if(!diffs.length){closeSheet();toast('No changes');return;}
    t.title=title||t.title;t.owner=owner;t.months=months;t.due=due;
    var text='Changed '+old+': '+diffs.join('; ');
    (t.changes=t.changes||[]).push({at:Date.now(),by:me(),text:text});
    log('upkeep',text);
    notify('tenant',state.unit.landlord+' updated an upkeep task. '+text+'.',{tab:'upkeep'});
    commit('Task updated');
  },
  newtask:function(fd){
    var t={id:uid(),title:fd.get('title').trim(),owner:fd.get('owner'),months:Number(fd.get('months')),due:fd.get('due'),history:[]};
    state.tasks.push(t);log('upkeep','Added task: '+t.title+' ('+roleLabel(t.owner).toLowerCase()+', '+cycleLabel(t.months).toLowerCase()+')');
    if(t.owner!==me())notify(t.owner,nameOf(me())+' added a task for you: '+t.title+', '+dueLabel(t.due).toLowerCase()+'.',{tab:'upkeep'});
    ui.tab='upkeep';commit('Task added');
  },
  newwalk:function(fd){
    var kind=fd.get('kind');var base=state.walks.find(function(w){return w.kind==='Move-in';});
    var w={id:uid(),kind:kind,status:'draft',date:isoD(d0()),startedBy:me(),baseId:base?base.id:null,
      rooms:base.rooms.map(function(r){return {name:r.name,items:r.items.map(function(i){return {name:i.name,cond:null,note:''};}),photos:[]};}),sig:{}};
    state.walks.push(w);log('records','Started a '+kind.toLowerCase()+' walkthrough');save();closeSheet();go({walk:w.id});
  },
  sign:function(fd){
    var w=getW(ui.walk),role=me();
    w.sig[role]={name:(fd.get('name')||nameOf(role)).trim(),at:Date.now(),img:sigImage(),note:fd.get('note').trim()};
    w.status=(w.sig.landlord&&w.sig.tenant)?'signed':'signing';
    log('records','Signed the '+w.kind.toLowerCase()+' walkthrough'+(w.sig[role].note?' with a note':''));
    if(w.status==='signing')notify(other(role),nameOf(role)+' signed the '+w.kind.toLowerCase()+' walkthrough. Please review and sign.',{walk:w.id});
    else notify(other(role),'The '+w.kind.toLowerCase()+' walkthrough is signed by both.',{walk:w.id});
    save();render(true);toast(w.status==='signed'?'Signed by both. Record locked.':'Signed. Waiting for '+nameOf(other(role))+'.');
  },
  newdoc:async function(fd){
    var file=fd.get('file'),hasFile=file&&file.name;
    if(!hasFile&&!ui.pending.length){toast('Take a photo or choose a file first');return;}
    var f=null;
    if(hasFile){f={name:file.name,size:file.size};if(/^image\//.test(file.type)){try{f.src=await readImage(file);}catch(e){}}}
    var d={id:uid(),title:fd.get('title').trim()||(hasFile?file.name:'Scanned document'),cat:fd.get('cat'),vis:fd.get('vis'),owner:me(),addedAt:Date.now(),expires:fd.get('expires')||null,file:f,scans:ui.pending.slice()};
    ui.pending=[];
    state.docs.push(d);if(d.vis==='shared'){log('docs','Added '+d.title);notify(other(),nameOf(me())+' added a document: '+d.title+'.',{tab:'docs'});}
    ui.docCat='All';save();closeSheet();go({tab:'docs'});
    toast(!storageOk?'Uploaded, but this browser can’t keep it after reload':d.vis==='shared'?'Uploaded and shared':'Uploaded. Only you can see it.');
  }
};

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(!el){if(e.target.id==='sheet')closeSheet();return;}
  var fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el.dataset,el,e);}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var fn=F[f.dataset.form];if(fn)fn(new FormData(f),f);
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset&&t.dataset.input;if(!k)return;
  if(k==='docQ'){ui.docQ=t.value;var l=document.getElementById('doclist');if(l)l.innerHTML=docListHtml();}
  if(k==='itemNote'){var w=getW(ui.walk);w.rooms[t.dataset.ri].items[t.dataset.ii].note=t.value;save();}
});
document.addEventListener('change',async function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.change==='ex5'){buy.ex5=t.checked;var v=29+(buy.ex5?9:0);var a=document.getElementById('ocTax'),b2=document.getElementById('ocTot');if(a)a.textContent=cad(v*0.13);if(b2)b2.textContent=cad(v*1.13);return;}
  if(t.dataset&&t.dataset.change==='editMonths'){
    var tk=getT(t.dataset.id),m=Number(t.value),ld=lastDone(tk),dueEl=document.getElementById('ed'),hint=document.getElementById('edhint');
    if(m>0&&dueEl){var base=ld?new Date(ld):parseD(tk.due);base.setHours(0,0,0,0);var nd=addMonths(base,m);if(!ld)nd=parseD(tk.due);dueEl.value=isoD(nd);
      if(hint)hint.textContent=ld?'Last done '+fmtD(ld,true)+', so '+cycleLabel(m).toLowerCase()+' makes it due '+fmtD(isoD(nd),true)+'. You can change this date.':'Not done yet, so the due date stays the same.';}
    return;
  }
  if(t.dataset&&t.dataset.change==='urgency'){var em=document.getElementById('emerg');if(em)em.hidden=t.value!=='Emergency';return;}
  if(!t.dataset||!t.dataset.file)return;
  var target=t.dataset.file;
  if(target==='docpick'){var ti=document.getElementById('dt');if(ti&&!ti.value&&t.files[0])ti.value=t.files[0].name.replace(/\.[^.]+$/,'');return;}
  var files=Array.prototype.slice.call(t.files||[]);if(!files.length)return;
  var added=[];
  var failed=0;
  for(var i=0;i<files.length;i++){try{added.push({src:await readImage(files[i]),label:'Photo',at:Date.now()});}catch(err){failed++;}}
  if(failed)toast(failed===files.length?'Couldn’t read that photo. Try a JPG or PNG, or pick it from your photo library.':'Added '+added.length+', but '+failed+' couldn’t be read');
  else toast(added.length===1?'Photo added':added.length+' photos added');
  t.value='';
  addPhotos(target,added);
});
function testPhotoSrc(){
  var c=document.createElement('canvas');c.width=640;c.height=480;var x=c.getContext('2d');
  var hue=Math.floor(Math.random()*360);
  var g=x.createLinearGradient(0,0,640,480);g.addColorStop(0,'hsl('+hue+',35%,62%)');g.addColorStop(1,'hsl('+((hue+40)%360)+',40%,38%)');
  x.fillStyle=g;x.fillRect(0,0,640,480);
  x.fillStyle='rgba(255,255,255,.9)';x.font='bold 44px sans-serif';x.textAlign='center';x.fillText('Test photo',320,230);
  x.font='26px sans-serif';x.fillText(fmtDT(Date.now()),320,280);
  return c.toDataURL('image/jpeg',0.7);
}
function addPhotos(target,added){
  if(!added.length)return;
  if(target==='pending'){ui.pending=ui.pending.concat(added);var p=document.getElementById('pending');if(p)p.innerHTML=pendingHtml('pending');}
  if(target.indexOf('doc:')===0){
    var doc=getDoc(target.slice(4));if(!doc)return;
    doc.scans=(doc.scans||[]).concat(added);
    log('docs','Added '+plural(added.length,'page photo')+' to '+doc.title);
    if(doc.vis==='shared')notify(other(),nameOf(me())+' added a photo of '+doc.title+'.',{tab:'docs'});
    save();sheetDoc(doc.id);var l=document.getElementById('doclist');if(l)l.innerHTML=docListHtml();
    return;
  }
  if(target==='room'){var w=getW(ui.walk);var room=w.rooms[Math.min(ui.room,w.rooms.length-1)];room.photos=room.photos.concat(added);save();var y=window.scrollY;render();window.scrollTo(0,y);if(!storageOk)toast('Photo added. This browser can’t keep it after reload.');}
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

/* ---------- Boot ---------- */
load();
loadSession();
render();
})();
</script>
